name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - run: uvx prek@0.5.9 run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [orders, weather]
    defaults:
      run:
        working-directory: ${{ matrix.bundle }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - run: uv sync --locked

      - run: uv run pytest

  bundle:
    needs: [lint, test]
    if: vars.DATABRICKS_HOST != ''
    runs-on: ubuntu-latest
    environment: acc
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        bundle: [platform, weather, orders]
    defaults:
      run:
        working-directory: ${{ matrix.bundle }}
    env:
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_deploy_sp: ${{ vars.DEPLOY_SP_ID }}
      BUNDLE_VAR_run_as_sp: ${{ vars.RUN_AS_SP_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - if: matrix.bundle == 'orders'
        run: uv sync --locked

      - uses: databricks/setup-cli@v1.23.0

      - run: databricks bundle validate --strict -t acc

      - run: databricks bundle plan -t acc | tee plan-acc.txt

      - uses: actions/upload-artifact@v7
        with:
          name: plan-acc-${{ matrix.bundle }}
          path: ${{ matrix.bundle }}/plan-acc.txt
