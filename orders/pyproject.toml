[project]
name = "orders"
version = "0.1.0"
description = "Medallion example bundle: orders"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
bronze = "orders.bronze:main"
silver = "orders.silver:main"

[dependency-groups]
dev = [
    "databricks-bundles>=1.23.0",
    "delta-spark>=4.4.1",
    "pyspark>=4.1,<4.2",
    "pytest",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orders"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["orders", "mutators"]
