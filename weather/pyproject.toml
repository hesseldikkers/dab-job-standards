[project]
name = "weather"
version = "0.1.0"
description = "Example bundle: weather observations"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
ingest = "weather.ingest:main"

[dependency-groups]
dev = [
    "pyspark>=4.1,<4.2",
    "pytest",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["weather"]
